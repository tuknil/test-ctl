# Two distinct services. The browser loads the UI from the ui service and
# calls the api service directly, so the two origins must agree:
#   ui  API_ENDPOINT          -> the api origin as the BROWSER sees it
#   api CORS_ALLOWED_ORIGINS  -> the ui origin as the BROWSER sees it
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: control-translation-service:local
    container_name: control-translation-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_PATH=/app/data/control_translation.db
      # The UI origin as the browser sees it, not the compose service name.
      - CORS_ALLOWED_ORIGINS=http://127.0.0.1:8080,http://localhost:8080
    volumes:
      - control-translation-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: control-translation-ui:local
    container_name: control-translation-ui
    ports:
      - "8080:8080"
    environment:
      - UI_HOST=0.0.0.0
      - UI_PORT=8080
      # Published to the browser, which runs on the host: it must be the
      # host-reachable URL, never http://api:8000.
      - API_ENDPOINT=http://127.0.0.1:8000
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready')"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  # The lean Go service: the ModSecurity -> Akamai compiler with Databricks
  # persistence, and a Postgres lifecycle queue. Not started by default: bring
  # it up with `docker compose --profile go up --build` and point the ui
  # service's API_ENDPOINT at http://127.0.0.1:8010. It needs real
  # DATABRICKS_DSN settings in .env or it will fail readiness.
  #
  # The deployed service authenticates to Azure Database for PostgreSQL with an
  # Entra token and has its schema applied externally. Compose runs the local
  # equivalent instead: an ordinary password, and the service creating its own
  # schema, which is what DATABASE_AUTH_MODE and DATABASE_MIGRATION_MODE select.
  api-go:
    profiles: ["go"]
    build:
      context: .
      dockerfile: go-api/Dockerfile
    image: control-translation-go:local
    container_name: control-translation-api-go
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ALLOWED_ORIGINS=http://127.0.0.1:8080,http://localhost:8080
      # The Go service takes its whole Databricks connection from this one
      # string and ignores the individual DATABRICKS_* variables in .env.
      - DATABRICKS_DSN=${DATABRICKS_DSN}
      # One string for the whole connection. The local server has no TLS, which
      # the password path allows; the deployed Entra path requires verify-full.
      - DATABASE_URL=postgres://control_translation:control_translation@postgres:5432/control_translation?sslmode=disable
      - DATABASE_AUTH_MODE=password
      - DATABASE_MIGRATION_MODE=managed
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The lifecycle queue for the Go service, and the database `go test ./...` in
  # go-api expects. Only started with the go profile:
  #   docker compose --profile go up -d postgres
  postgres:
    profiles: ["go"]
    image: postgres:16-alpine
    container_name: control-translation-postgres
    environment:
      - POSTGRES_DB=control_translation
      - POSTGRES_USER=control_translation
      - POSTGRES_PASSWORD=control_translation
    ports:
      # Published so `go test ./...` in go-api can reach it; see go-api/README.md.
      - "55432:5432"
    volumes:
      - control-translation-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control_translation -d control_translation"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  control-translation-data:
  control-translation-postgres:
