name: CI - Python Build

on:
  schedule:
    - cron: '00 02 * * *'

  push:
    branches: [ "main" ]

  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "main" ]

  workflow_dispatch:
    ## This workflow can be manually triggered via the GitHub UI.
    ## The inputs defined below determine the steps to execute.
    ## The `default` value specifies the initial option displayed in the UI only.
    inputs:
      apps_to_build:
        description: 'Application to Build (AUTO|ALL or empty for AUTO; use selected_projects for explicit selection)'
        default: 'ALL'
        required: true
        type: string

      selected_projects:
        description: 'Comma-separated project keys to build (overrides apps_to_build when provided)'
        default: ''
        required: false
        type: string

      enable_sonar:
        description: 'Enable Sonar'
        default: false
        required: true
        type: boolean

      enable_veracode_sast:
        description: 'Enable VeraCode SAST'
        default: false
        required: true
        type: boolean

      enable_veracode_sca:
        description: 'Enable VeraCode SCA'
        default: false
        required: true
        type: boolean

      enable_veracode_pipeline_scan:
        description: 'Enable VeraCode Pipeline Scan'
        default: false
        required: false
        type: boolean

      enable_deployment:
        description: 'Enable Deployment'
        default: false
        required: true
        type: boolean

      runner_group:
        description: 'Runner group'
        default: 'concordia-linux-cpu2-ram7gi'
        required: false
        type: string

jobs:
  run:
    name: Run Python CI Workflow
    secrets: inherit
    uses: ATT-IDP/revup-workflows/.github/workflows/reusable_workflow_python_monorepo_ci.yaml@v5
    with:
      enable_sonar: ${{ inputs.enable_sonar }}
      enable_veracode_sast: ${{ inputs.enable_veracode_sast }}
      enable_veracode_sca: ${{ inputs.enable_veracode_sca }}
      enable_veracode_pipeline_scan: ${{ inputs.enable_veracode_pipeline_scan }}
      enable_deployment: ${{ inputs.enable_deployment }}
      runner_group: ${{ inputs.runner_group }}
      apps_to_build: ${{ github.event.inputs.apps_to_build }}
      selected_projects: ${{ github.event.inputs.selected_projects }}

  print-environment:
    name: Print Environment Variables
    needs: run
    runs-on: concordia-linux-cpu2-ram7gi
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CICD_APP_ID }}
          private-key: ${{ secrets.CICD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print version from shared variables
        id: image-version
        shell: bash
        run: |
          vars_file=".github/variables/shared_vars.yaml"
          version="$(awk -F"'" '/^version:/ { print $2; found=1 } END { if (!found) exit 1 }' "$vars_file")"
          image_version="${version}${GITHUB_RUN_NUMBER}"
          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
          echo "GITHUB_RUN_NUMBER: $GITHUB_RUN_NUMBER"
          echo "image_version: $image_version"
          echo "======================================"
          echo " Triggering Central CI/CD"
          echo "======================================"
          echo "Source Repository : ${{ github.repository }}"
          echo "Branch            : ${{ github.ref_name }}"
          echo "Commit SHA        : ${{ github.sha }}"
          echo "Triggered By      : ${{ github.actor }}"
          echo "Workflow          : ${{ github.workflow }}"
          echo "Run ID            : ${{ github.run_id }}"
          echo ""
          echo "Images:"
          echo " control-translation"
          echo ""
          echo "Target Repository : amp0047460-devop"
          echo "Event Type        : feature-build"
          echo "======================================"

      - name: Trigger amp0047460-devop
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: 'amp0047460-devop',
              event_type: 'feature-build',

              client_payload: {
                repository: context.repo.owner + '/apm0047460-Janus-control-translation',
                ref: context.ref.replace('refs/heads/', ''),
                sha: context.sha,
                triggered_by: context.actor,

                images: [
                  {
                    name: 'janus-control-translation/control-translation',
                    tag: `${{ steps.image-version.outputs.image_version }}`
                  },
                ]
              }
            });

            console.log('repository_dispatch sent successfully');
            console.log('Target: amp0047460-devop');
            console.log('Event: feature-build');
